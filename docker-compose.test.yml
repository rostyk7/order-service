services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: order_service
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders -d order_service']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql+asyncpg://orders:orders@postgres:5432/order_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_PROVIDER_URL: http://localhost:3000   # not used in unit tests
      SELF_BASE_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
