name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ── 1. Unit tests (no Docker, fast) ────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ --ignore=tests/e2e -v --tb=short --cov=app --cov-report=term-missing

  # ── 2. Full-stack E2E tests (payment-provider from GHCR + real webhooks) ─────
  full-e2e-tests:
    name: Full E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (pull payment-provider image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up any leftover containers from previous attempts
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans || true

      - name: Run full-stack e2e tests
        run: |
          docker compose -f docker-compose.e2e.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from e2e

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes

  # ── 3. Build & push to GHCR (main branch only) ─────────────────────────────
  publish:
    # After this job the image is available at:
    #   docker pull ghcr.io/GITHUB_USERNAME/order-service:latest
    #   docker pull ghcr.io/GITHUB_USERNAME/order-service:sha-<commit>
    name: Build & Push to ghcr.io
    runs-on: ubuntu-latest
    needs: full-e2e-tests
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image links
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Published image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r tag; do
            echo "- \`docker pull $tag\`" >> $GITHUB_STEP_SUMMARY
          done <<< "$TAGS"
